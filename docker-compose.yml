services:
  pansou-bot:
    image: ghcr.io/tumblr-code/pansou-bot:latest
    build: .
    container_name: pansou-bot
    env_file:
      - .env
    volumes:
      - ./data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
