services:
  pansou-bot:
    image: ghcr.io/tumblr-code/pansou-bot:latest
    build: .
    container_name: pansou-bot
    env_file:
      - .env
    volumes:
      - ./data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # 想在宿主机上直接调用 PanSou 搜索 API 时取消注释（只绑定本机地址）
    # ports:
    #   - "127.0.0.1:8888:8888"
