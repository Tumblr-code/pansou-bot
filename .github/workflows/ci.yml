name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate tracked files for secrets
        run: python scripts/secret_scan.py
      - name: Compile and smoke import
        run: |
          python -m compileall -q main.py src scripts tests
          python scripts/smoke_test.py
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Dependency consistency
        run: python -m pip check

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pansou-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Bundled engine starts and passes its health check
        run: docker run --rm --read-only --tmpfs /tmp pansou-bot:ci python main.py check-engine
      - name: Bundled engine carries upstream defaults
        run: |
          docker run --rm --entrypoint sh pansou-bot:ci -c \
            'cat /opt/pansou/VERSION.json && grep -q "^CHANNELS=" /opt/pansou/defaults.env && grep -q "^ENABLED_PLUGINS=" /opt/pansou/defaults.env'
